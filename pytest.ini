[pytest]
# 指定 pytest 从哪个目录收集测试用例
testpaths = tests

# 指定测试文件命名规则，例如 test_login.py
python_files = test_*.py

# 指定测试类命名规则，例如 class TestCommunity
python_classes = Test*

# 指定测试函数命名规则，例如 def test_login()
python_functions = test_*

# pytest 默认执行参数
# -v 表示显示更详细的用例执行信息，保留 pytest 自带的日志功能。
addopts = -v

# 控制终端是否实时打印日志
# false：不实时打印日志
# true：实时打印日志
# 这里只控制终端实时输出，不影响 logs/ 中的文件日志。
log_cli = false

# 控制终端显示哪些级别的日志
# INFO 表示显示 info、warning、error、critical 级别日志
log_cli_level = INFO

# 控制终端日志格式
log_cli_format = %(asctime)s - %(levelname)s - %(filename)s - %(message)s

# 控制终端日志时间格式
log_cli_date_format = %Y-%m-%d %H:%M:%S
